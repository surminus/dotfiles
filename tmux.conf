# Plugins, managed by tpm. Prefix + I installs them the first time.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'dracula/tmux'

# Prefix is C-x rather than the default C-b
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Vim keys in copy mode: v starts a selection, y copies it and leaves copy
# mode, Enter copies and stays. Copies go to the system clipboard through
# OSC 52, which works over ssh as long as the terminal supports it (kitty
# does), so no xclip needed.
setw -g mode-keys vi
set -s set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection

# Pass CSI u sequences through, so Shift+Enter and Ctrl+Enter reach the
# application rather than arriving as a plain Enter. Claude Code uses them
# for a newline without submitting.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# New windows and splits open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Kill the pane without asking
bind x kill-pane

# Switch windows with Shift+Left/Right, no prefix needed
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n S-Up last-window

# Name windows after the process running in them, so the list at the bottom
# stays short, and close gaps in the numbering when one goes
set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'
set -g renumber-windows on

# No per-pane border bar, the title lives in status-right now
set -g pane-border-status off

# The default 2000 lines is not much when an agent is printing to the pane
set -g history-limit 100000

# Flag the window when something rings the bell in it, so a long running
# command asking for input in another window is visible
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# Let the pane title reach the terminal, so window titles say what is running
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# True colour, see https://dandavison.github.io/delta/using-delta-with-tmux.html
set -as terminal-features ',xterm-256color:RGB'

# Let escape sequences tmux does not understand through to the terminal,
# for images and desktop notifications
set -g allow-passthrough on

# Bring windows back after a restart
set -g @continuum-restore 'on'

# Dracula theme, swapped in for the default green. No extra widgets (cpu,
# weather etc), just the window list
set -g @dracula-show-left-icon window
set -g @dracula-plugins ' '

# Initialise tpm. Not backgrounded (-b), so dracula finishes setting its own
# options before the override below runs, instead of racing it
run '~/.tmux/plugins/tpm/tpm'

# Full pane title on the right of the status bar, overriding dracula's,
# highlighted to stand out from the rest of the bar
set -g status-right-length 250
set -g status-right '#[bg=colour61,fg=colour231,bold] #{pane_title} #[default]'
