# Plugins, managed by tpm. Prefix + I installs them the first time.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Vim keys in copy mode: v starts a selection, y copies it and leaves copy
# mode, Enter copies and stays. Copies go to the system clipboard through
# OSC 52, which works over ssh as long as the terminal supports it (kitty
# does), so no xclip needed.
setw -g mode-keys vi
set -s set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection

# New windows and splits open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Kill the pane without asking
bind x kill-pane

# Name windows after the directory they are in, so a window per repo names
# itself, and close gaps in the numbering when one goes
set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g renumber-windows on

# Scroll with the mouse
set -g mouse on

# True colour, see https://dandavison.github.io/delta/using-delta-with-tmux.html
set -ga terminal-overrides ",xterm-256color:Tc"

# Bring windows back after a restart
set -g @continuum-restore 'on'

# Initialise tpm. Keep this line at the very bottom.
run -b '~/.tmux/plugins/tpm/tpm'
